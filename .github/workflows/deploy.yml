name: Deploy Website to VPS

on:
  release:
    types: [published]

  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          DEPLOY_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$DEPLOY_EVENT" = "release" ]; then
            : "${RELEASE_TAG:?Release tag is required}"
            export SITE_VERSION="$RELEASE_TAG"
            export SITE_VERSION_TYPE="release"
          elif [ "$DEPLOY_EVENT" = "workflow_dispatch" ]; then
            COMMIT_SHA="$(git rev-parse HEAD)"
            export SITE_VERSION="${COMMIT_SHA:0:6}"
            export SITE_VERSION_TYPE="commit"
            export SITE_VERSION_REF="$COMMIT_SHA"
          else
            echo "Unsupported deployment event: $DEPLOY_EVENT" >&2
            exit 1
          fi
          npm run build

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "${{ vars.VPS_PORT }}" \
            "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${{ vars.VPS_PORT }}" \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            "echo 'SSH connection successful'"

      - name: Deploy website
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ vars.VPS_PORT }}" \
            dist/ \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${{ vars.VPS_TARGET }}"

      - name: Deployment complete
        run: echo "Website deployed successfully."