name: Deploy Website to VPS

on:
  release:
    types: [published]

  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "${{ vars.VPS_PORT }}" \
            "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${{ vars.VPS_PORT }}" \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            "echo 'SSH connection successful'"

      - name: Deploy website
        run: |
          rsync -avz --delete \
            --exclude=".gitignore" \
            --exclude=".github/" \
            --exclude="README.md" \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ vars.VPS_PORT }}" \
            ./ \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${{ vars.VPS_TARGET }}"

      - name: Deployment complete
        run: echo "Website deployed successfully."