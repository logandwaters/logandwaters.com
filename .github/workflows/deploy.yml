name: Deploy Website to VPS

on:
  release:
    types: [published]

  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          DEPLOY_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$DEPLOY_EVENT" = "release" ]; then
            : "${RELEASE_TAG:?Release tag is required}"
            export SITE_VERSION="$RELEASE_TAG"
            export SITE_VERSION_TYPE="release"
          elif [ "$DEPLOY_EVENT" = "workflow_dispatch" ]; then
            COMMIT_SHA="$(git rev-parse HEAD)"
            export SITE_VERSION="${COMMIT_SHA:0:6}"
            export SITE_VERSION_TYPE="commit"
            export SITE_VERSION_REF="$COMMIT_SHA"
          else
            echo "Unsupported deployment event: $DEPLOY_EVENT" >&2
            exit 1
          fi
          npm run build

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          : "${VPS_HOST:?VPS_HOST is required}"
          : "${VPS_PORT:?VPS_PORT is required}"
          : "${VPS_SSH_KNOWN_HOSTS:?VPS_SSH_KNOWN_HOSTS secret is required}"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          if [ "$VPS_PORT" = "22" ]; then
            KNOWN_HOST="$VPS_HOST"
          else
            KNOWN_HOST="[$VPS_HOST]:$VPS_PORT"
          fi
          if ! ssh-keygen -F "$KNOWN_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "VPS_SSH_KNOWN_HOSTS has no key for $KNOWN_HOST" >&2
            exit 1
          fi

          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/deploy_key \
            -p "${{ vars.VPS_PORT }}" \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            "echo 'SSH connection successful'"

      - name: Deploy website
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key -p ${{ vars.VPS_PORT }}" \
            dist/ \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${{ vars.VPS_TARGET }}"

      - name: Deployment complete
        run: echo "Website deployed successfully."